</head>
<body>

  <path d="M49.5 23Q55 27.5 60.5 23"/>

  <path d="M42.5 119.5Q55 126 67.5 119.5"/>
</symbol></svg>

<header class="top">
  <div class="wrap">
    <a class="mark" href="./" aria-label="Watchful, home">
      <svg class="glyph" viewBox="0 0 110 138" aria-hidden="true"><use href="#watchful-mark"/></svg>
    </a>
    <nav class="links" aria-label="Main">
      <a href="./">Home</a>
      <a href="./#creations">Writing</a>
      <a href="./#passages">Passages</a>
      <a href="./#essays">Essays</a>
    </nav>
    <a class="btn" href="./#connect">Reach out</a>
  </div>
</header>

<main class="reader">
  <article class="wrap" id="article">
    <a class="back" href="./#essays">← All essays</a>
  </article>
</main>

<footer>
  <div class="wrap">
    <div class="row">
      <span>Watchful · A Human Connection</span>
      <span>© 2026 Jesse O'Meara</span>
    </div>
  </div>
</footer>

<script src="content.js"></script>
<script>
const esc = (t) => String(t ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const slug = new URLSearchParams(location.search).get("p");
const essay = WATCHFUL.essays.find((e) => e.slug === slug);
const article = document.getElementById("article");
if (essay) {
  document.title = `${essay.title} · Watchful`;
  article.insertAdjacentHTML("beforeend", `
    <span class="eyebrow">${esc(essay.date || "Essay")}</span>
    <h1>${esc(essay.title)}</h1>
    <div class="body">${(essay.body || []).map((p) => `<p>${esc(p)}</p>`).join("")}</div>
    <p class="sign" style="font-family: var(--display); font-style: italic; font-size: 1.6rem; color: var(--moss);">Jesse</p>`);
} else {
  article.insertAdjacentHTML("beforeend", `<h1>This piece isn't here yet.</h1><p>It may still be on its way.</p>`);
}
</script>
</body>
</html>
